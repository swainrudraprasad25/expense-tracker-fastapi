{% extends "home.html" %}
{% block content %}
{% if result %}
<div class="card table-card">
<h3>Expense History:</h3>
<table  class="expense-table">
    <tr>
        {% for col in result[0].keys() %}
        <th>
            {{ col }}
        </th>
        {% endfor %}
    </tr>
    {% for row in result %}
    <tr>
        {% for value in row.values() %}
        <td>{{ value }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>
{% else %}
<p>Please add expense </p>

{% endif %}
</div>
{% endblock %}
