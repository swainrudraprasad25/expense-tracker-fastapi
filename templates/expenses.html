{% extends "home.html" %}
{% block content %}
{% if result %}
<h2>Expense History:</h2>
<table border="1" cellspacing="0" cellpadding="8">
    <tr>
        {% for col in result[0].keys() %}
        <th>
            {{ col }}
        </th>
        {% endfor %}
    </tr>
    {% for row in result %}
    <tr>
        {% for value in row.values() %}
        <td>{{ value }}</td>
        {% endfor %}
    </tr>
    {% endfor %}
</table>
{% else %}
<p>Please add expense </p>

{% endif %}
{% endblock %}
