{% extends "home.html" %}
{% block content %}
<h3>ADD EXPENSE:</h3>
    <form action="http://127.0.0.1:8000/add-expense" method="post" target="_blank">
    <label for="expense_id">Expense Id:</label>
    <input type="number" id="expense_id" name="expense_id">
    <br>
    <label for="catagory">Expense Catagory:</label>
    <input type="text" id="catagory" name="catagory">
    <br>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" name="amount"><br>
    <br>
    <label for="description">Description:</label>
    <input type="text" id="description" name="description">
    <br>
    <label for="expense_date">Date:</label>
    <input type="date" id="expense_date" name="expense_date">
    <br>
    <label for="submit">Click to submit:</label>
    <button type="submit" id="submit">submit</button>
    </form>
{% endblock %}
